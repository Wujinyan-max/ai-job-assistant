version: "3.9"

services:
  # ------------------------------------------------------------------ MySQL
  mysql:
    image: mysql:8.0
    container_name: jobpath-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_job_assistant
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      # MySQL 容器首次启动时按字母序执行 docker-entrypoint-initdb.d 下的 .sql 文件
      # schema.sql 先跑，migrations 按版本号依次执行
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ../sql/migrations/V2__ai_user_config.sql:/docker-entrypoint-initdb.d/02-ai-user-config.sql:ro
      - ../sql/migrations/V3__ai_usage_and_pricing.sql:/docker-entrypoint-initdb.d/03-ai-usage.sql:ro
      - ../sql/migrations/V4__normalize_question_category.sql:/docker-entrypoint-initdb.d/04-normalize-question.sql:ro
      - ../sql/migrations/V5__fill_missing_question_category.sql:/docker-entrypoint-initdb.d/05-fill-question.sql:ro
      - ../sql/migrations/V6__resume_content_json.sql:/docker-entrypoint-initdb.d/06-resume-json.sql:ro
      - ../sql/migrations/V7__user_token_id.sql:/docker-entrypoint-initdb.d/07-user-token-id.sql:ro
    networks:
      - jobpath
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------ 后端
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: jobpath-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8088
      # 数据库
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ai_job_assistant
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # 注册 / 登录限流（防刷号、防撞库）
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REGISTER_MAX: ${RATE_LIMIT_REGISTER_MAX:-3}
      RATE_LIMIT_REGISTER_TOTAL: ${RATE_LIMIT_REGISTER_TOTAL:-10}
      # AI（可选，不填则走本地模拟引擎）
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_CONFIG_ENCRYPTION_KEY: ${AI_CONFIG_ENCRYPTION_KEY}
    networks:
      - jobpath

  # ------------------------------------------------------------------ 前端
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: jobpath-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - jobpath

networks:
  jobpath:
    driver: bridge

volumes:
  mysql_data:
